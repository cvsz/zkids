name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,production]'
      - name: Format check
        run: |
          ruff format --check \
            src/zkids/api.py \
            src/zkids/auth.py \
            src/zkids/cli.py \
            src/zkids/infrastructure.py \
            src/zkids/models.py \
            src/zkids/production.py \
            src/zkids/providers.py \
            src/zkids/runtime.py \
            src/zkids/worker.py \
            tests/test_p1_offline.py \
            tests/test_p2_production.py
      - name: Lint
        run: |
          ruff check \
            src/zkids/api.py \
            src/zkids/auth.py \
            src/zkids/cli.py \
            src/zkids/infrastructure.py \
            src/zkids/models.py \
            src/zkids/production.py \
            src/zkids/providers.py \
            src/zkids/runtime.py \
            src/zkids/worker.py \
            tests/test_p1_offline.py \
            tests/test_p2_production.py
      - run: mypy src/zkids
      - run: bandit -q -r src/zkids
      - run: pytest
      - name: Offline CLI E2E
        run: |
          zkids validate examples/episode-001
          zkids plan examples/episode-001/timeline.json > /tmp/plan.json
          zkids qc examples/episode-001
          zkids package examples/episode-001 --output /tmp/zkids-dist
          test -f /tmp/zkids-dist/package-manifest.json
      - name: Docker build
        run: docker build -t zkids:p2 .
      - name: Compose validation
        run: docker compose -f compose.production.yml config >/tmp/compose.yml
