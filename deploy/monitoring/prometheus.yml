global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: zkid-api
    static_configs: [{ targets: ["api:8010"] }]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: postgres
    static_configs: [{ targets: ["postgres:5432"] }]

  - job_name: caddy
    static_configs: [{ targets: ["caddy:2019"] }]

alerting:
  alertmanagers: []

rule_files: []
