services:
  api:
    build: .
    command: ["web", "--host", "0.0.0.0", "--port", "8010", "--root", "/data"]
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    deploy:
      resources: { limits: { cpus: "1.5", memory: 1G }, reservations: { memory: 512M } }
    environment:
      ZKID_WEB_TOKEN_FILE: /run/secrets/web_token
      DATABASE_URL: postgres://zkid:${POSTGRES_PASSWORD}@postgres:5432/zkid
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: zkid-assets
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret
    secrets: [web_token, s3_access, s3_secret, postgres_password]
    volumes: [zkid_data:/data, zkid_logs:/data/logs]
    networks: [internal, public]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/ready', timeout=3).read()"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, minio: { condition: service_healthy } }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3", labels: "service=api" } }

  worker:
    build: .
    command: ["worker", "--root", "/data"]
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: { resources: { limits: { cpus: "2", memory: 2G } } }
    environment:
      DATABASE_URL: postgres://zkid:${POSTGRES_PASSWORD}@postgres:5432/zkid
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    secrets: [postgres_password, s3_access, s3_secret]
    volumes: [zkid_data:/data]
    networks: [internal]
    depends_on: [postgres, redis, minio]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: zkid, POSTGRES_USER: zkid, POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password }
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data, ./migrations:/docker-entrypoint-initdb.d:ro]
    networks: [internal]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U zkid"], interval: 10s, timeout: 3s, retries: 5 }
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck: { test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"], interval: 10s, timeout: 3s, retries: 5 }
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-08-26T15-33-07Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER_FILE: /run/secrets/s3_access, MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret }
    secrets: [s3_access, s3_secret]
    volumes: [minio_data:/data]
    networks: [internal]
    healthcheck: { test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"], interval: 15s, timeout: 5s, retries: 3 }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes: [./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    networks: [public, internal]
    depends_on: [api]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]

  prometheus:
    image: prom/prometheus:v2.55
    volumes: [./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus_data:/prometheus]
    networks: [internal]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2
    environment: { GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin }
    secrets: [grafana_admin]
    volumes: [grafana_data:/var/lib/grafana, ./deploy/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro]
    networks: [internal, public]
    depends_on: [prometheus]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    volumes: [postgres_data:/pgdata:ro, zkid_data:/zkid_data:ro, ./deploy/backup.sh:/usr/local/bin/backup.sh:ro]
    environment: { PGPASSWORD_FILE: /run/secrets/postgres_password, S3_ENDPOINT: http://minio:9000, S3_BUCKET: zkid-backups }
    secrets: [postgres_password]
    entrypoint: ["sh", "-c", "while true; do /usr/local/bin/backup.sh; sleep 86400; done"]
    networks: [internal]
    restart: unless-stopped

volumes:
  zkid_data: { driver: local }
  zkid_logs: { driver: local }
  postgres_data: { driver: local }
  redis_data: { driver: local }
  minio_data: { driver: local }
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  grafana_data: {}

networks:
  internal: { internal: true, driver: bridge }
  public: { driver: bridge }

secrets:
  web_token: { file: ./secrets/web_token.txt }
  postgres_password: { file: ./secrets/postgres_password.txt }
  s3_access: { file: ./secrets/s3_access.txt }
  s3_secret: { file: ./secrets/s3_secret.txt }
  grafana_admin: { file: ./secrets/grafana_admin.txt }
  redis_password: { file: ./secrets/redis_password.txt }
